<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Minimalist Strap Loops -->
  <path d="M 200 130 C 200 80 312 80 312 130" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>
  <path d="M 200 382 C 200 432 312 432 312 382" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>

  <!-- Minimalist Haptic Vibration Arcs Left -->
  <path d="M 115 190 A 85 85 0 0 0 115 322" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M 75 160 A 130 130 0 0 0 75 352" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

  <!-- Minimalist Haptic Vibration Arcs Right -->
  <path d="M 397 190 A 85 85 0 0 1 397 322" fill="none" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
  <path d="M 437 160 A 130 130 0 0 1 437 352" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.3"/>

  <!-- Minimalist Tracker Capsule -->
  <rect x="180" y="125" width="152" height="262" rx="64" fill="url(#cyanGrad)"/>
  <rect x="190" y="135" width="132" height="242" rx="54" fill="#090d16"/>

  <!-- Minimalist Haptic Pulse Line -->
  <path d="M 215 256 L 235 256 L 246 220 L 266 292 L 277 256 L 297 256" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
