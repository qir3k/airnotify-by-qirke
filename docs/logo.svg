<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Haptic Vibration Waves Left -->
  <path d="M 120 196 A 80 80 0 0 0 120 316" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  <path d="M 80 166 A 125 125 0 0 0 80 346" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" opacity="0.25"/>

  <!-- Haptic Vibration Waves Right -->
  <path d="M 392 196 A 80 80 0 0 1 392 316" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  <path d="M 432 166 A 125 125 0 0 1 432 346" fill="none" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" opacity="0.25"/>

  <!-- Fitbit Air Loop Strap (Top & Bottom) -->
  <path d="M 216 160 L 216 100 C 216 68 296 68 296 100 L 296 160" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>
  <path d="M 216 352 L 216 412 C 216 444 296 444 296 412 L 296 352" fill="none" stroke="#64748b" stroke-width="20" stroke-linecap="round"/>

  <!-- Fitbit Air Central Pebble Tracker -->
  <rect x="180" y="140" width="152" height="232" rx="60" fill="url(#accentGrad)"/>
  <rect x="188" y="148" width="136" height="216" rx="52" fill="#090d16"/>

  <!-- Lightning Bolt / Pulse Icon inside Pebble -->
  <path d="M 264 192 L 224 264 L 256 264 L 248 320 L 292 248 L 260 248 Z" fill="url(#boltGrad)" stroke="#fef08a" stroke-width="3" stroke-linejoin="round"/>
</svg>
